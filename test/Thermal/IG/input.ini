[ICE-Parameters]
time-threshold = 0.1
; never stop on the residual: the blob starts at rest, so the density residual is zero at step 1
res-threshold  = 0

[ICE-Numerics]
time-scheme          = RK3
; 0.5, not 0.8: the step is the minimum of the per-direction limits, so on the diagonals of the
; expanding blob the two Courant numbers add, and at 0.8 an odd-even mode grows and floors cells
cfl                  = 0.5
time-accurate        = true
space-reconstruction = MUSCL
flux-limiter         = vanleer
; lifts the default 1e-4 s ceiling, far below the CFL step of this unit-scale problem
dt-max               = 1e-2

[ICE-Physics]
; constants, not a table: INPUT holds no part-properties.dat, so these two are the material
density       = 2000
specific-heat = 1

[ICE-Family1]
closure = IG

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 1
