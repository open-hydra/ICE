[ICE-Parameters]
iter-threshold = 200
; the density residual of this stationary field is at roundoff from step 1: never stop on it
res-threshold  = 0

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.8
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer
; the detector is what reads the side-face ghosts of an MK case
shock-detector       = Jameson

[ICE-Physics]
density       = 2000
specific-heat = 1000

[ICE-Family1]
closure = MK

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 1
