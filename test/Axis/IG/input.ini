[ICE-Parameters]
iter-threshold = 500
; at equilibrium the density residual is exactly zero: never stop on it
res-threshold  = 0

[ICE-Numerics]
time-scheme          = RK2
cfl                  = 0.8
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer
shock-detector       = none

[ICE-Physics]
density       = 2000
specific-heat = 1000

[ICE-Family1]
closure = IG

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 50
