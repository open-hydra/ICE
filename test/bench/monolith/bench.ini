# ICE strong-scaling benchmark: 192^3 = 7,077,888 cells, IG closure, a particle
# cloud dragged by a frozen Taylor-Green vortex. See gencase.f90 (Marco Grossi's
# generator, kept in the campaign copy) and README.md.
#
# time-accurate = true is a stability requirement here, not a preference.
# With local time stepping every cell picks its own dt from its own |u_p| + a;
# as the dispersed phase develops, cells whose dispersion collapses take an
# oversized step and the run diverges. It is resolution-dependent because more
# cells means more chances to find such a cell: 64^3 survives 40 iterations at
# CFL 0.8, 128^3 diverges by iteration 9 and 192^3 by iteration 7, all
# bit-identically on 1 thread and on 16, so it is the scheme and not a race.
# A global dt also gives every cell the same step, so the work per cell is
# uniform -- which is what a scaling benchmark wants -- at the cost of one
# allreduce per iteration, which the timers report separately as collective wait.
#
# CFL 0.5 rather than the 0.8 that measured clean: the margin is free, since dt
# changes the physical time covered but not the work done per iteration, and a
# decomposed run reconstructs differently across block boundaries.
#
# dt-max and tau-factor are pinned (2026-09-30): the campaign binaries predate
# the tau-factor key, whose default is now 1; a value of 0 switches the tau cap
# off and reproduces what the campaign ran. Neither binds on this case
# (tau_p about 1.2 ms against dt about 1e-5 s), so the pin is documentary.
[ICE-Parameters]
iter-threshold = 40
res-threshold  = 0.0

[ICE-Numerics]
time-scheme          = RK2
cfl                  = 0.5
time-accurate        = true
dt-max               = 1.0e-4
tau-factor           = 0.0
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag           = Schiller-Naumann
heat-transfer  = Ranz-Marshall
density        = 1000.0
specific-heat  = 4180.0
emissivity     = 0.0

[ICE-IO]
ic-format   = tecplot binary
sol-format  = tecplot binary
shell-diter = 10
res-diter   = 100000000
sol-diter   = 100000000
timers      = true

[ICE-Family1]
closure = IG
