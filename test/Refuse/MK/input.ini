[ICE-Parameters]
time-threshold = 4.4e-4
iter-threshold = 10

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.8
time-accurate        = true
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Stokes
heat-transfer = JAXA3
density       = 2000
specific-heat = 1000
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 1
