[ICE-Parameters]
time-threshold = 0.1
; never stop on the residual
res-threshold  = 0

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.8
time-accurate        = true
space-reconstruction = MUSCL
flux-limiter         = vanleer
; lifts the default 1e-4 s ceiling, far below the CFL step of this unit-scale problem
dt-max               = 1e-2

[ICE-Physics]
density       = 2000
specific-heat = 1

[ICE-Family1]
closure = AG

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 1
