[ICE-Parameters]
time-threshold = 0.125

[ICE-Numerics]
time-scheme          = RK2
cfl                  = 0.5
time-accurate        = true
space-reconstruction = MUSCL
flux-limiter         = mc

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 100

[ICE-Family1]
closure = AG

; How the mesh and the phase table in this directory were generated
[GRIB-meshgen]
outpath = ./MESH/
method  = fmsh
type    = 2Dplane

[GRIB-Block1]
pivot  = -0.5 0.0 0.0
length = 1.0
height = 0.001
nx     = 500
ny     = 1
strx   = R 1.0
stry   = U 1.0

[GPB-Phase1]
type = condensed-dispersed
name = part
cp   = 1598
rho  = 2700
