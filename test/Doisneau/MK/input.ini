[ICE-Parameters]
iter-threshold = 5000

[ICE-Numerics]
time-scheme          = RK2
cfl                  = 0.8
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer
shock-detector       = Jameson

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 10

[ICE-Family1]
closure = MK
