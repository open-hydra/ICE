[ICE-Parameters]
cfl            = 0.8
time-accurate  = false
iter-threshold = 5000

[ICE-Scheme]
space-reconstruction = MUSCL-SD
flux-limiter         = VANLEER
time                 = 2

[ICE-Family1]
model = MK

[ICE-IO]
bck-format  = tecplot ascii
sol-format  = tecplot ascii
shell-diter = 10

; End of solver input

[BCB-Block1]
face1 = ptc
face2 = ext
face3 = ext
face4 = ext
face5 = nul
face6 = nul

[ptc]
direction = y
range1 = -0.5 -0.3
patch1 = sym
range2 = -0.3 -0.2
patch2 = inj1
range3 = -0.2 0.2
patch3 = sym
range4 = 0.2 0.3
patch4 = inj2
range5 = 0.3  0.5
patch5 = sym

[nul]
type = 0

[sym]
type = 3

[inj1]
type = 4
gp = 0.7071
|up| = 10
Tp = 300
rp = 1e-6
alphap = 0.7854

[inj2]
type = 4
gp = 0.7071
|up| = 10
Tp = 300
rp = 1e-6
alphap = -0.7854

[ext]
type = 11
