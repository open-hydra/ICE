[ICE-Parameters]
time-threshold = 2.7e-4
; never stop on the residual
res-threshold  = 0

[ICE-Numerics]
; explicit Euler at first order: no limiter and no multistage scheme to hide a wrong Rusanov speed
time-scheme          = euler
cfl                  = 0.8
time-accurate        = true
space-reconstruction = first-order
; above the CFL step of a few microseconds, so the CFL condition sets the step
dt-max               = 1e-3

[ICE-Physics]
density       = 2000
specific-heat = 1000

[ICE-Family1]
closure = AG

[ICE-IO]
ic-format   = tecplot ascii
sol-format  = tecplot ascii
; one line per step: the first Delta t is the Courant check of the gate
shell-diter = 1
